<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aula 3: Agendamento de Monitoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f4ee;
      --paper: #ffffff;
      --surface: #ece9df;
      --ink: #161614;
      --muted: #5a5952;
      --accent: #14532d;
      --accent-ink: #ffffff;
      --border: #cfc9ba;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2.5rem 1.25rem;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      background-color: var(--paper);
      border: 1px solid var(--border);
      padding: 2.25rem;
    }

    header {
      border-bottom: 2px solid var(--ink);
      padding-bottom: 1.1rem;
      margin-bottom: 1.75rem;
    }

    header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.85rem;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    fieldset {
      border: 1px solid var(--border);
      padding: 1.25rem 1.4rem;
      margin: 0 0 1.5rem;
    }

    legend {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      padding: 0 0.45rem;
    }

    .campo {
      margin-bottom: 1rem;
    }

    .campo:last-child {
      margin-bottom: 0;
    }

    label.rotulo {
      display: block;
      font-weight: 600;
      font-size: 0.94rem;
      margin-bottom: 0.35rem;
    }

    .opcoes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.4rem;
      padding-top: 0.25rem;
    }

    .opcoes label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-weight: 400;
      cursor: pointer;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      background-color: #fcfbf8;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.96rem;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .botoes {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    button {
      padding: 0.72rem 1.35rem;
      border-radius: 2px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    button[type="submit"] {
      border: 1px solid var(--accent);
      background-color: var(--accent);
      color: var(--accent-ink);
    }

    button[type="submit"]:hover {
      background-color: #0f3f22;
    }

    button[type="reset"] {
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--ink);
    }

    button[type="reset"]:hover {
      background-color: #e2ddd0;
    }

    @media (max-width: 540px) {
      main {
        padding: 1.4rem;
      }

      .botoes {
        flex-direction: column-reverse;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ficha de Agendamento no Laboratório</h1>
      <p>Reserva de horário para atendimento presencial com a monitoria de Front-End.</p>
    </header>

    <form action="#" method="post">
      <fieldset>
        <legend>Identificação do aluno</legend>

        <div class="campo">
          <label class="rotulo" for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Ex.: Caio Rodrigues" required />
        </div>

        <div class="campo">
          <label class="rotulo" for="email">E-mail institucional</label>
          <input type="email" id="email" name="email" placeholder="aluno@instituicao.edu.br" required />
        </div>

        <div class="campo">
          <label class="rotulo" for="telefone">Telefone para aviso</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(43) 99999-0000" />
        </div>

        <div class="campo">
          <label class="rotulo" for="data">Data desejada</label>
          <input type="date" id="data" name="data" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Detalhes do atendimento</legend>

        <div class="campo">
          <label class="rotulo" for="turno">Período disponível</label>
          <select id="turno" name="turno">
            <option value="">Selecione um período</option>
            <option value="manha">Manhã (08h às 11h)</option>
            <option value="tarde">Tarde (14h às 17h)</option>
            <option value="noite">Noite (19h às 21h)</option>
          </select>
        </div>

        <div class="campo">
          <label class="rotulo">Frente da dúvida</label>
          <div class="opcoes">
            <label><input type="radio" name="frente" value="html" checked /> Estrutura HTML</label>
            <label><input type="radio" name="frente" value="css" /> Layout CSS</label>
            <label><input type="radio" name="frente" value="js" /> JavaScript</label>
          </div>
        </div>

        <div class="campo">
          <label class="rotulo">Recursos necessários na bancada</label>
          <div class="opcoes">
            <label><input type="checkbox" name="recursos" value="vscode" /> Editor VS Code</label>
            <label><input type="checkbox" name="recursos" value="git" /> Terminal Git</label>
            <label><input type="checkbox" name="recursos" value="projetor" /> Revisão em tela compartilhada</label>
          </div>
        </div>

        <div class="campo">
          <label class="rotulo" for="descricao">Resumo do exercício ou erro encontrado</label>
          <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva em poucas linhas o ponto que deseja revisar..."></textarea>
        </div>
      </fieldset>

      <div class="botoes">
        <button type="reset">Limpar ficha</button>
        <button type="submit">Solicitar horário</button>
      </div>
    </form>
  </main>
</body>
</html>
