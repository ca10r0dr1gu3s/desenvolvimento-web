<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aula 3 - Nosso Primeiro Formulário</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
      margin: 0;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #0f172a;
    }

    fieldset {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    legend {
      font-weight: 600;
      padding: 0 0.5rem;
      color: #1d4ed8;
    }

    .campo {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    .opcoes label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 400;
      margin-right: 1rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .botoes {
      display: flex;
      gap: 0.75rem;
    }

    button {
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"] {
      background-color: #1d4ed8;
      color: #ffffff;
    }

    button[type="reset"] {
      background-color: #e2e8f0;
      color: #334155;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nosso Primeiro Formulário</h1>
      <p>Atividade prática da Aula 3: estruturação de formulário HTML com diferentes tipos de entrada.</p>
    </header>

    <form action="#" method="post">
      <fieldset>
        <legend>Dados do Estudante</legend>

        <div class="campo">
          <label for="nome">Nome completo:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required />
        </div>

        <div class="campo">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required />
        </div>

        <div class="campo">
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" />
        </div>

        <div class="campo">
          <label for="nascimento">Data de nascimento:</label>
          <input type="date" id="nascimento" name="nascimento" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Preferências da Disciplina</legend>

        <div class="campo">
          <label for="turno">Turno de estudo:</label>
          <select id="turno" name="turno">
            <option value="">Selecione...</option>
            <option value="manha">Manhã</option>
            <option value="tarde">Tarde</option>
            <option value="noite">Noite</option>
          </select>
        </div>

        <div class="campo opcoes">
          <label>Área de maior interesse:</label>
          <label><input type="radio" name="area" value="frontend" checked /> Front-end</label>
          <label><input type="radio" name="area" value="backend" /> Back-end</label>
          <label><input type="radio" name="area" value="fullstack" /> Full Stack</label>
        </div>

        <div class="campo opcoes">
          <label>Conteúdos já conhecidos:</label>
          <label><input type="checkbox" name="conhecimentos" value="html" /> HTML</label>
          <label><input type="checkbox" name="conhecimentos" value="css" /> CSS</label>
          <label><input type="checkbox" name="conhecimentos" value="js" /> JavaScript</label>
        </div>

        <div class="campo">
          <label for="observacoes">Observações:</label>
          <textarea id="observacoes" name="observacoes" rows="4" placeholder="Escreva suas expectativas para a disciplina..."></textarea>
        </div>
      </fieldset>

      <div class="botoes">
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
      </div>
    </form>
  </main>
</body>
</html>
